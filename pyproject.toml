[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sandwich-panel"
version = "1.0.0"
description = "Verified sandwich-panel mechanics and preliminary honeycomb core selection for a spacecraft solar-panel substrate (STM-10)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
figures = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
