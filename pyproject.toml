[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandwich-panel"
version = "0.4.0"
description = "Verified sandwich-panel mechanics foundation for honeycomb core selection (STM-10, Milestone 1)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

# NOTE: no `license` field and no LICENSE file are provided on purpose.
# No licensing decision has been made for this project yet.

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
